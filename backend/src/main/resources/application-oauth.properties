# Google "Sign in with Google" support - inactive unless this profile is enabled.
#
# Kept in a separate profile (rather than application.properties) on purpose: Spring Boot's
# OAuth2 client autoconfiguration fails app startup with "Client id must not be empty" if a
# google registration block exists with a blank client-id, which it would be for anyone who
# hasn't set up Google OAuth credentials yet. Keeping it in its own profile means the app boots
# fine with plain email/password login by default, and this only takes effect once you opt in.
#
# To enable:
#   1. In Google Cloud Console, create an OAuth 2.0 Client ID (Web application) with
#      authorized redirect URI: http://localhost:8080/login/oauth2/code/google
#   2. Set GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET as environment variables.
#   3. Run the backend with the "oauth" profile active, e.g.
#      SPRING_PROFILES_ACTIVE=oauth mvn spring-boot:run

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
