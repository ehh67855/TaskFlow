<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{email/layout :: layout(~{::content})}">
<body>
<div th:fragment="content">
    <h1 th:replace="~{email/components :: heading('Reset your password')}"></h1>
    <p th:replace="~{email/components :: paragraph(${greeting})}"></p>
    <p style="margin:0 0 16px;">
        We received a request to reset the password for your account
        (<strong style="color:#18181b; font-weight:600;" th:text="${email}">you@example.com</strong>).
        Click the button below to choose a new one.
    </p>

    <table th:replace="~{email/components :: button(${actionUrl}, 'Reset password')}"></table>

    <p th:replace="~{email/components :: note('For your security, this link expires in 1 hour and can only be used once.')}"></p>

    <!-- Security callout -->
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:8px 0 0;">
        <tr>
            <td style="background-color:#fafafa; border:1px solid #e4e4e7; border-left:3px solid #18181b; border-radius:8px; padding:14px 16px; font-size:13px; line-height:20px; color:#52525b;">
                <strong style="color:#18181b;">Didn't request this?</strong>
                You can safely ignore this email &mdash; your password won't change unless you open the link above and set a new one.
            </td>
        </tr>
    </table>

    <table th:replace="~{email/components :: divider}"></table>
    <div th:replace="~{email/components :: fallbackLink(${actionUrl})}"></div>
</div>
</body>
</html>
