server.port=${PORT:8080}

security.jwt.token.secret-key=${JWT_SECRET:secret-key}

app.frontend-url=${FRONTEND_URL:http://localhost:4200}

# Local-only secrets (DB/mail credentials, JWT secret) live in application-local.properties,
# which is gitignored. See application-local.properties.example for the keys it needs.
spring.config.import=optional:classpath:application-local.properties

spring.jpa.hibernate.ddl-auto=update
# Without this, Hibernate maps @Lob String fields to Postgres' oid large-object type instead of
# a plain text column (MySQL isn't affected - LONGTEXT is already its default @Lob mapping).
spring.jpa.properties.hibernate.type.preferred_long_string_jdbc_type=VARCHAR
spring.datasource.url=${DATABASE_URL:jdbc:mysql://${MYSQL_HOST:localhost}:3306/Frame}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DATABASE_DRIVER:com.mysql.cj.jdbc.Driver}
spring.jpa.show-sql=true

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
